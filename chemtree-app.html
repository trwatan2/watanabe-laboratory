<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ChemTree — an interactive 3D map for exploring recent chemistry literature from JACS, Chem, and chemistry-related papers in Nature and Science." />
  <meta name="theme-color" content="#030a13" />
  <title>ChemTree | Watanabe Laboratory</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.2.8",
      "react/jsx-runtime": "https://esm.sh/react@19.2.8/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@19.2.8",
      "react-dom/client": "https://esm.sh/react-dom@19.2.8/client",
      "three": "https://esm.sh/three@0.185.1",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.7.0?bundle&external=react,react-dom,three",
      "@react-three/drei": "https://esm.sh/@react-three/drei@10.7.8?bundle&external=react,react-dom,three,@react-three/fiber"
    }
  }
  </script>
  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #02050a; }
    * { box-sizing: border-box; }
    .lab-back {
      position: fixed; left: 14px; bottom: 12px; z-index: 1000;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 999px;
      color: #b8dfff; background: rgba(2, 8, 16, .78);
      border: 1px solid rgba(113, 223, 255, .24);
      text-decoration: none; font: 600 11px/1.2 Arial, sans-serif;
      backdrop-filter: blur(10px);
    }
    .lab-back:hover { border-color: rgba(113, 223, 255, .65); color: #fff; }
    .loading-note {
      position: fixed; inset: 0; z-index: 900; display: grid; place-items: center;
      color: #9ec7df; background: radial-gradient(circle at 50% 42%, #0a2239 0%, #040c16 48%, #02050a 100%);
      font: 600 14px/1.6 Arial, sans-serif; letter-spacing: .03em;
    }
  </style>
</head>
<body>
  <div id="root"><div class="loading-note">Loading ChemTree dataset…</div></div>
  <a class="lab-back" href="playground.html">← Watanabe Laboratory / Playground</a>
  <script type="module">
    import { StrictMode } from 'react';
    import { createRoot } from 'react-dom/client';
    import { jsx } from 'react/jsx-runtime';
    import App from './chemtree-App.js';
    createRoot(document.getElementById('root')).render(jsx(StrictMode, { children: jsx(App, {}) }));
  </script>
</body>
</html>
