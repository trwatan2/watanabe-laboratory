<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

<title>ChemTree Mobile 3D | Watanabe Laboratory</title>
<style>
:root{color-scheme:dark;font-family:Arial,"Helvetica Neue",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#fff;overscroll-behavior:none}
button,input{font:inherit}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#0a2239 0%,#040c16 48%,#02050a 100%)}
#scene{position:absolute;left:0;right:0;top:174px;bottom:62px;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:40;display:flex;align-items:center;padding:0 10px;background:rgba(3,10,19,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(120,190,255,.12)}
.brand{font-size:20px;font-weight:800;letter-spacing:-.8px}.spacer{flex:1}.reset{height:34px;padding:0 12px;border-radius:18px;border:1px solid rgba(100,200,255,.28);background:rgba(20,90,160,.20);color:#a8e8ff;font-size:11px;font-weight:700}
.searchbar{position:absolute;top:61px;left:10px;right:10px;z-index:39}.searchbar .inner{position:relative}.searchbar input{width:100%;height:36px;padding:0 82px 0 13px;border-radius:18px;border:1px solid rgba(120,190,255,.20);background:rgba(7,20,33,.95);color:#fff;outline:none;font-size:12px}.searchbar button{position:absolute;top:3px;right:3px;height:30px;padding:0 13px;border:0;border-radius:16px;background:linear-gradient(90deg,#178cff,#40dcff);color:#fff;font-size:11px;font-weight:700}
.filter{position:absolute;left:50%;transform:translateX(-50%);z-index:38;display:flex;gap:4px;padding:4px;border-radius:24px;background:rgba(4,14,25,.88);border:1px solid rgba(120,190,255,.16);backdrop-filter:blur(14px);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}.journals{top:104px}.periods{top:143px}.filter button{height:30px;min-width:44px;padding:0 10px;border-radius:16px;flex:0 0 auto;border:1px solid rgba(120,190,255,.10);background:rgba(8,24,39,.65);color:#8faabd;font-size:10px;font-weight:500}.filter button.active.journal{border-color:rgba(80,210,255,.65);background:linear-gradient(90deg,rgba(20,125,220,.72),rgba(30,190,220,.55));color:#fff;font-weight:700}.filter button.active.period{border-color:rgba(130,230,180,.70);background:linear-gradient(90deg,rgba(20,150,115,.75),rgba(45,205,165,.55));color:#fff;font-weight:700}
.hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:5;padding:6px 9px;border-radius:20px;background:rgba(5,16,28,.74);border:1px solid rgba(110,190,255,.20);color:#cceaff;font-size:9px;white-space:nowrap;pointer-events:none}
.bottomnav{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:55;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottomnav button{height:42px;border-radius:21px;border:1px solid rgba(110,200,255,.30);font-size:12px;font-weight:700}.topicsBtn{background:rgba(5,20,34,.94);color:#b8ebff}.papersBtn{background:linear-gradient(90deg,rgba(20,105,180,.94),rgba(20,170,190,.90));color:#fff}
.sheetBackdrop{position:absolute;inset:0;z-index:80;background:rgba(1,7,14,.58);display:none}.sheetBackdrop.open{display:block}.sheet{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:66dvh;overflow-y:auto;border-radius:18px;padding:16px;background:rgba(5,14,25,.98);border:1px solid rgba(120,190,255,.24);backdrop-filter:blur(18px);color:#fff}.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.sheetHead small{display:block;color:#71dfff;font-size:10px;letter-spacing:1.2px;margin-bottom:4px}.sheetHead strong{font-size:18px}.close{border:0;background:transparent;color:#9dcfe9;font-size:24px;line-height:1;padding:0 4px}.topicRow{width:100%;text-align:left;padding:12px 13px;margin-bottom:8px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#fff}.topicRow.active{border-color:#71dfff;background:rgba(35,140,200,.18)}.topicCount{float:right;color:#88a7bb}.paperLink,.paperPlain{display:block;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);text-decoration:none}.paperTitle{font-size:13px;line-height:1.48;color:#e7f3fb}.paperMeta{margin-top:5px;font-size:10px;color:#7893aa}.openPaper{margin-top:5px;font-size:10px;color:#71dfff}.countryWrap{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}.country{padding:5px 8px;border-radius:999px;background:rgba(70,140,190,.16);border:1px solid rgba(110,190,255,.14);font-size:10px;color:#b9d8e9}
.loading{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 42%,#0a2239 0%,#040c16 48%,#02050a 100%);color:#9fdfff;font-weight:700;font-size:14px;line-height:1.6}.loading.hide{display:none}.err{color:#ff9a9a}
.labBack{position:absolute;left:10px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:54;color:#b8dfff;text-decoration:none;font-size:9px;font-weight:700;padding:6px 9px;border-radius:999px;background:rgba(2,8,16,.72);border:1px solid rgba(113,223,255,.22)}
@media (orientation:landscape) and (max-height:520px){#scene{top:96px;bottom:50px}.searchbar{top:8px;left:118px;right:96px}.topbar{height:46px}.journals{top:52px;left:35%}.periods{top:52px;left:72%}.brand{font-size:17px}.bottomnav{left:auto;width:220px}.labBack{bottom:8px}}
</style>
</head>
<body>
<div id="app">
  <div id="loading" class="loading">Loading the 3D ChemTree…<br><span style="font-size:11px;color:#789bb0">Optimized mobile dataset: about 2.3 MB</span></div>
  <div class="topbar"><div class="brand">ChemTree</div><div class="spacer"></div><button id="resetBtn" class="reset">Reset</button></div>
  <div class="searchbar"><div class="inner"><input id="searchInput" placeholder="Search topic or paper…"><button id="searchBtn">Search</button></div></div>
  <div id="journalFilter" class="filter journals"></div>
  <div id="periodFilter" class="filter periods"></div>
  <div id="scene"><div class="hint">1 finger: Rotate / Pinch: Zoom / Tap: Explore</div></div>
  <a class="labBack" href="playground.html">← Playground</a>
  <div class="bottomnav"><button id="topicsBtn" class="topicsBtn">Topics</button><button id="papersBtn" class="papersBtn">Papers ↗</button></div>
  <div id="topicsBackdrop" class="sheetBackdrop"><div class="sheet"><div class="sheetHead"><div><small>EXPLORE</small><strong>Topics</strong></div><button class="close" data-close="topicsBackdrop">×</button></div><div id="topicsList"></div></div></div>
  <div id="papersBackdrop" class="sheetBackdrop"><div class="sheet"><div class="sheetHead"><div><small>RECENT PAPERS</small><strong id="paperNodeTitle">Chemistry</strong></div><button class="close" data-close="papersBackdrop">×</button></div><div id="countryList" class="countryWrap"></div><div id="papersList"></div></div></div>
</div>
<script type="module">
import * as THREE from './chemtree-three.module.js';
import { OrbitControls } from './chemtree-OrbitControls.js';

const branchColors={catalysis:'#72ff9b',materials:'#68b7ff',synthesis:'#c887ff',biochem:'#ffd478',analytical:'#67f0e5',physical:'#ff8fa8',theory:'#ffb86c',unclassified:'#718096',chemistry:'#8ed8ff'};
const mainPositions={chemistry:[0,-1.45,0],catalysis:[-4.8,1.45,1.8],materials:[-3.1,2.8,-2.6],synthesis:[-0.7,3.55,2.5],biochem:[2.8,2.9,-2.5],analytical:[4.9,1.55,1.6],physical:[-3.3,0,-3.1],theory:[3.4,.05,-3],unclassified:[0,.35,-4.2]};
const mainBranches=['catalysis','materials','synthesis','biochem','analytical','physical','theory'];
const journals=['All','JACS','Nature','Science','Chem']; const periods=['1M','3M','6M','1Y']; const periodDays={1M:30,3M:90,6M:180,1Y:365};
let data=null,state={journal:'All',period:'1Y',selected:'chemistry'},view=null;
let renderer,scene,camera,controls,treeGroup,raycaster,pointer,hitMeshes=[],selectedMesh=null,down={x:0,y:0};
const $=id=>document.getElementById(id);

function paperHref(p){const u=String(p.url||'').trim();if(/^https?:\/\//i.test(u))return u;if(/^10\./.test(u))return 'https://doi.org/'+u;const d=String(p.doi||'').trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,'');return d?'https://doi.org/'+d:''}
function inPeriod(p,period){if(period==='1Y')return true;const end=Date.parse(String(data.period?.end||'')+'T23:59:59Z');const t=Date.parse(String(p.published||'')+'T00:00:00Z');if(!Number.isFinite(end)||!Number.isFinite(t))return false;return t>=end-periodDays[period]*86400000&&t<=end}
function matches(p){return (state.journal==='All'||String(p.journal||'')===state.journal)&&inPeriod(p,state.period)}
function currentView(){const agg=data.viewAggregates?.[state.period]?.[state.journal];const counts=agg?.counts||data.counts;const countries=agg?.countryCounts||data.countryCounts;const nodePapers={};for(const n of data.treeDefinition){const arr=n.id==='chemistry'?data.papers:(data.nodePapers[n.id]||[]);nodePapers[n.id]=arr.filter(matches).sort((a,b)=>String(b.published).localeCompare(String(a.published))).slice(0,n.id==='chemistry'?60:40)}return{counts,countryCounts:countries,nodePapers}}
function byId(){return Object.fromEntries(data.treeDefinition.map(n=>[n.id,n]))}
function mainBranch(nodeId,map){if(nodeId==='chemistry')return'chemistry';if(nodeId==='unclassified')return'unclassified';let c=map[nodeId],seen=new Set();while(c&&c.parent&&!seen.has(c.id)){seen.add(c.id);if(c.parent==='chemistry')return c.id;c=map[c.parent]}return'unclassified'}
function buildPositions(defs,counts){const positions={...mainPositions},map=Object.fromEntries(defs.map(n=>[n.id,n])),children=new Map();for(const n of defs){if(!n.parent)continue;if(!children.has(n.parent))children.set(n.parent,[]);children.get(n.parent).push(n)}function place(parentId,depth){const pp=positions[parentId];if(!pp)return;const ch=(children.get(parentId)||[]).filter(n=>(counts[n.id]||0)>0).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));if(!ch.length)return;const pd=map[parentId],gp=pd?.parent,origin=gp?positions[gp]:mainPositions.chemistry;const out=new THREE.Vector3(pp[0]-origin[0],pp[1]-origin[1],pp[2]-origin[2]);if(out.lengthSq()<.0001)out.set(pp[0],1,pp[2]);out.normalize();let ref=new THREE.Vector3(0,1,0);if(Math.abs(out.dot(ref))>.92)ref=new THREE.Vector3(0,0,1);const side=new THREE.Vector3().crossVectors(out,ref).normalize(),around=new THREE.Vector3().crossVectors(side,out).normalize();const seed=[...parentId].reduce((t,c)=>t+c.charCodeAt(0),0),phase=(seed%360)*Math.PI/180,total=ch.length===1?0:Math.min(Math.PI*1.55,Math.PI*.48*(ch.length-1));ch.forEach((child,i)=>{const rel=ch.length===1?0:i/(ch.length-1)-.5,angle=phase+rel*total,cc=counts[child.id]||0,forward=1.15+depth*.28+Math.min(.35,Math.sqrt(cc)*.035),radius=.72+depth*.20+Math.min(.28,ch.length*.035),v=new THREE.Vector3(...pp);v.add(out.clone().multiplyScalar(forward));v.add(side.clone().multiplyScalar(Math.cos(angle)*radius));v.add(around.clone().multiplyScalar(Math.sin(angle)*radius));v.y+=.28+depth*.12;positions[child.id]=[v.x,v.y,v.z];place(child.id,depth+1)})}for(const b of mainBranches)place(b,1);return positions}
function clearGroup(g){while(g.children.length){const o=g.children.pop();o.traverse?.(x=>{x.geometry?.dispose?.();if(x.material){const ms=Array.isArray(x.material)?x.material:[x.material];ms.forEach(m=>{m.map?.dispose?.();m.dispose?.()})}})}}
function labelSprite(text,color='#fff',main=false){const c=document.createElement('canvas');c.width=main?420:320;c.height=96;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.font=`700 ${main?34:28}px Arial`;x.textAlign='center';x.textBaseline='middle';x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=10;x.fillStyle=color;x.fillText(text,c.width/2,c.height/2);const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false});const spr=new THREE.Sprite(mat);spr.scale.set(main?3.4:2.6,main?.78:.62,1);return spr}
function tube(start,end,color,radius){const s=new THREE.Vector3(...start),e=new THREE.Vector3(...end),m1=s.clone().lerp(e,.33);m1.y+=.22;const m2=s.clone().lerp(e,.7);m2.y+=.12;const curve=new THREE.CatmullRomCurve3([s,m1,m2,e]);const geo=new THREE.TubeGeometry(curve,16,radius,5,false);return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.72}))}
function rebuild(){view=currentView();clearGroup(treeGroup);hitMeshes=[];selectedMesh=null;const counts=view.counts,map=byId(),pos=buildPositions(data.treeDefinition,counts),visible=data.treeDefinition.filter(n=>n.id==='chemistry'||mainBranches.includes(n.id)||(counts[n.id]||0)>0),ids=new Set(visible.map(n=>n.id)),max=Math.max(1,...Object.values(counts));for(const n of visible){if(n.parent&&ids.has(n.parent)&&pos[n.parent]&&pos[n.id]){const mb=mainBranch(n.id,map),color=branchColors[mb]||'#8ed8ff',norm=Math.sqrt((counts[n.id]||0)/max),r=n.parent==='chemistry'?.055+norm*.07:.018+norm*.045;treeGroup.add(tube(pos[n.parent],pos[n.id],color,r))}}for(const n of visible){const p=pos[n.id];if(!p)continue;const mb=mainBranch(n.id,map),color=branchColors[mb]||'#8ed8ff',norm=Math.sqrt((counts[n.id]||0)/max),main=n.id==='chemistry'||mainBranches.includes(n.id),size=n.id==='chemistry'?.36:main?.22+norm*.11:.105+norm*.09;const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,16,12),new THREE.MeshBasicMaterial({color}));mesh.position.set(...p);mesh.userData={nodeId:n.id,baseScale:1};treeGroup.add(mesh);hitMeshes.push(mesh);const label=labelSprite(n.label,'#fff',main);label.position.set(p[0],p[1]+size+.28,p[2]);treeGroup.add(label)}treeGroup.position.y=-.2;renderTopics();selectNode(state.selected,false)}
function selectNode(id,focus=true){state.selected=id;if(selectedMesh)selectedMesh.scale.setScalar(1);selectedMesh=hitMeshes.find(m=>m.userData.nodeId===id)||null;if(selectedMesh)selectedMesh.scale.setScalar(1.35);renderPapers();renderTopics();if(focus&&selectedMesh){const world=selectedMesh.getWorldPosition(new THREE.Vector3());const dir=camera.position.clone().sub(controls.target).normalize();const dist=mainBranches.includes(id)?10:id==='chemistry'?18:7;controls.target.copy(world);camera.position.copy(world).add(dir.multiplyScalar(dist));controls.update()}}
function reset(){state.selected='chemistry';if(selectedMesh)selectedMesh.scale.setScalar(1);selectedMesh=null;camera.position.set(0,.9,18.5);controls.target.set(0,.8,0);controls.update();renderPapers();renderTopics()}
function renderFilters(){const jf=$('journalFilter');jf.innerHTML='';journals.forEach(j=>{const b=document.createElement('button');b.textContent=j;b.className='journal'+(state.journal===j?' active':'');b.onclick=()=>{state.journal=j;state.selected='chemistry';renderFilters();rebuild();reset()};jf.appendChild(b)});const pf=$('periodFilter');pf.innerHTML='';periods.forEach(p=>{const b=document.createElement('button');b.textContent=p;b.className='period'+(state.period===p?' active':'');b.onclick=()=>{state.period=p;state.selected='chemistry';renderFilters();rebuild();reset()};pf.appendChild(b)})}
function renderTopics(){if(!view)return;const el=$('topicsList');el.innerHTML='';const ids=['chemistry',...mainBranches];for(const id of ids){const n=data.treeDefinition.find(x=>x.id===id),b=document.createElement('button');b.className='topicRow'+(state.selected===id?' active':'');b.innerHTML=`${n?.label||id}<span class="topicCount">${view.counts[id]||0}</span>`;b.onclick=()=>{selectNode(id,true);closeSheet('topicsBackdrop')};el.appendChild(b)}}
function renderPapers(){if(!view)return;const n=data.treeDefinition.find(x=>x.id===state.selected);$('paperNodeTitle').textContent=n?.label||state.selected;const c=view.countryCounts[state.selected]||{};$('countryList').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`<span class="country">${k} · ${v}</span>`).join('');const arr=view.nodePapers[state.selected]||[];$('papersList').innerHTML=arr.length?'':'<div style="color:#8aa0b2;font-size:13px">No papers in this view.</div>';for(const p of arr.slice(0,30)){const href=paperHref(p),wrap=document.createElement(href?'a':'div');wrap.className=href?'paperLink':'paperPlain';if(href){wrap.href=href;wrap.target='_blank';wrap.rel='noopener noreferrer'}wrap.innerHTML=`<div class="paperTitle">${escapeHtml(p.title||'Untitled')}</div><div class="paperMeta">${escapeHtml(p.published||'')}</div>${href?'<div class="openPaper">OPEN PAPER ↗</div>':''}`;$('papersList').appendChild(wrap)}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openSheet(id){$(id).classList.add('open')}function closeSheet(id){$(id).classList.remove('open')}
function runSearch(){const q=$('searchInput').value.trim().toLowerCase();if(!q)return;const node=data.treeDefinition.find(n=>n.label.toLowerCase().includes(q));if(node){selectNode(node.id,true);return}const p=data.papers.find(p=>String(p.title||'').toLowerCase().includes(q));if(p?.classification?.branch)selectNode(p.classification.branch,true)}
function init3D(){const host=$('scene');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(56,host.clientWidth/host.clientHeight,.1,100);camera.position.set(0,.9,18.5);renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));renderer.setSize(host.clientWidth,host.clientHeight);renderer.setClearColor(0x000000,0);host.prepend(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.enablePan=false;controls.minDistance=4.5;controls.maxDistance=28;controls.rotateSpeed=.65;controls.zoomSpeed=.8;controls.target.set(0,.8,0);treeGroup=new THREE.Group();scene.add(treeGroup);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();const starGeo=new THREE.BufferGeometry(),pts=[];for(let i=0;i<120;i++)pts.push((Math.random()-.5)*28,(Math.random()-.5)*20,(Math.random()-.5)*20);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x8fcfff,size:.035,transparent:true,opacity:.55})));renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>10)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(hitMeshes,false);if(hits[0])selectNode(hits[0].object.userData.nodeId,true)});addEventListener('resize',resize3D);animate()}
function resize3D(){const h=$('scene');if(!renderer||!h)return;camera.aspect=h.clientWidth/h.clientHeight;camera.updateProjectionMatrix();renderer.setSize(h.clientWidth,h.clientHeight)}
function animate(){requestAnimationFrame(animate);controls?.update();renderer?.render(scene,camera)}
async function start(){try{const r=await fetch('./chemtree-data.json?v=35',{cache:'no-store'});if(!r.ok)throw new Error('Data HTTP '+r.status);data=await r.json();view=currentView();renderFilters();init3D();rebuild();reset();$('loading').classList.add('hide')}catch(e){$('loading').innerHTML='<div class="err">ChemTree could not be loaded.<br><small>'+escapeHtml(e.message||e)+'</small></div>'}}
$('resetBtn').onclick=reset;$('searchBtn').onclick=runSearch;$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('topicsBtn').onclick=()=>openSheet('topicsBackdrop');$('papersBtn').onclick=()=>{renderPapers();openSheet('papersBackdrop')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));document.querySelectorAll('.sheetBackdrop').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeSheet(b.id)}));
start();
</script>
</body>
</html>
