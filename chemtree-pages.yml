name: ChemTree Daily Update + GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # 21:10 UTC = 06:10 JST (next day)
    - cron: '10 21 * * *'
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chemtree-source/package-lock.json

      - name: Restore OpenAlex caches
        id: openalex-cache
        uses: actions/cache@v6
        with:
          path: |
            chemtree-source/public/data/openalex-filter-cache-1y.json
            chemtree-source/public/data/openalex-tree-cache-1y.json
          key: chemtree-openalex-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            chemtree-openalex-${{ runner.os }}-

      - name: Seed OpenAlex caches on first run
        shell: bash
        run: |
          mkdir -p chemtree-source/public/data
          test -f chemtree-source/public/data/openalex-filter-cache-1y.json || cp chemtree-source/seed/openalex-filter-cache-1y.json chemtree-source/public/data/
          test -f chemtree-source/public/data/openalex-tree-cache-1y.json || cp chemtree-source/seed/openalex-tree-cache-1y.json chemtree-source/public/data/

      - name: Install ChemTree dependencies
        working-directory: chemtree-source
        run: npm ci

      - name: Update literature data (365 days, retry up to 3 times)
        working-directory: chemtree-source
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "ChemTree update attempt ${attempt}/3"
            if npm run update; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 90))
            fi
          done
          exit 1

      - name: Prepare deploy-only data
        working-directory: chemtree-source
        run: npm run prepare-deploy

      - name: Build ChemTree
        working-directory: chemtree-source
        run: npm run build

      - name: Assemble entire Watanabe Laboratory site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          # Keep the laboratory website exactly as stored in the repository,
          # but do not publish build/source internals or obsolete ChemTree bundles.
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='chemtree-source/' \
            --exclude='node_modules/' \
            --exclude='chemtree-app.html' \
            --exclude='chemtree-App.js' \
            --exclude='chemtree-CameraFocus.js' \
            --exclude='chemtree-GrowthGlow.js' \
            --exclude='chemtree-fflate.js' \
            --exclude='chemtree-1y.json.gz' \
            --exclude='chemtree-mobile*.html' \
            --exclude='chemtree-mobile*.json'

          rm -rf _site/chemtree
          cp -a chemtree-source/dist _site/chemtree
          cp chemtree-source/redirect/chemtree-app.html _site/chemtree-app.html

          # Avoid Jekyll processing; this is a pure static deployment.
          touch _site/.nojekyll

          echo 'Published ChemTree status:'
          cat chemtree-source/deploy-public/data/public-status.json
          echo
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
