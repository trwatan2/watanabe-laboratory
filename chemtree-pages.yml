name: Watanabe Lab Pages Recovery + ChemTree

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 21 * * *'   # 06:10 JST

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watanabe-lab-pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect ChemTree source
        id: detect
        shell: bash
        run: |
          if [ -f chemtree-source/package.json ]; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.detect.outputs.has_source == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update ChemTree without risking the website
        id: ct
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.detect.outputs.has_source == 'true'
        continue-on-error: true
        shell: bash
        working-directory: chemtree-source
        run: |
          npm ci
          npm run update
          npm run prepare-deploy
          npm run build

      - name: Publish updated ChemTree files into repository
        if: steps.ct.outcome == 'success'
        shell: bash
        run: |
          rm -rf chemtree
          cp -a chemtree-source/dist chemtree
          cp chemtree-source/redirect/chemtree-app.html chemtree-app.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A chemtree chemtree-app.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update ChemTree $(date -u +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Assemble current laboratory website
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='chemtree-source/' \
            --exclude='node_modules/' \
            --exclude='*.zip' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        id: config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
