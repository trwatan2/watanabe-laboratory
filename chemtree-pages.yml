name: ChemTree Daily Update

on:
  workflow_dispatch:
  schedule:
    # 21:10 UTC = 06:10 JST
    - cron: '10 21 * * *'

permissions:
  contents: write

concurrency:
  group: chemtree-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout laboratory website repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chemtree-source/package-lock.json

      - name: Restore OpenAlex caches
        uses: actions/cache@v6
        with:
          path: |
            chemtree-source/public/data/openalex-filter-cache-1y.json
            chemtree-source/public/data/openalex-tree-cache-1y.json
          key: chemtree-openalex-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            chemtree-openalex-${{ runner.os }}-

      - name: Seed caches on first run
        shell: bash
        run: |
          mkdir -p chemtree-source/public/data
          test -f chemtree-source/public/data/openalex-filter-cache-1y.json || cp chemtree-source/seed/openalex-filter-cache-1y.json chemtree-source/public/data/
          test -f chemtree-source/public/data/openalex-tree-cache-1y.json || cp chemtree-source/seed/openalex-tree-cache-1y.json chemtree-source/public/data/

      - name: Install ChemTree dependencies
        working-directory: chemtree-source
        run: npm ci

      - name: Update literature data
        working-directory: chemtree-source
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "ChemTree update attempt ${attempt}/3"
            if npm run update; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 90))
            fi
          done
          exit 1

      - name: Prepare deploy data
        working-directory: chemtree-source
        run: npm run prepare-deploy

      - name: Build ChemTree
        working-directory: chemtree-source
        run: npm run build

      - name: Replace ONLY the public ChemTree files
        shell: bash
        run: |
          rm -rf chemtree
          cp -a chemtree-source/dist chemtree
          cp chemtree-source/redirect/chemtree-app.html chemtree-app.html

          # IMPORTANT:
          # index.html, research.html, people.html, publications.html, etc.
          # are NOT touched by this workflow.

      - name: Commit updated ChemTree to the existing website branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A chemtree chemtree-app.html

          if git diff --cached --quiet; then
            echo "No public ChemTree changes to commit."
            exit 0
          fi

          git commit -m "Auto-update ChemTree $(date -u +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
