name: Visitor Country Statistics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visitor-country-stats.yml'
  schedule:
    # Refresh hourly; preserve the last successful snapshot on API failure.
    - cron: '25 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: visitor-country-stats
  cancel-in-progress: false

jobs:
  update-country-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch GoatCounter country statistics
        shell: bash
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          if [ -z "$GOATCOUNTER_API_KEY" ]; then
            echo "GOATCOUNTER_API_KEY is not configured."
            exit 1
          fi

          node <<'NODE'
          (async () => {
          const fs = require('fs');

          const token = process.env.GOATCOUNTER_API_KEY;
          const base = 'https://watanabe-lab.goatcounter.com/api/v0';
          const start = '2026-08-31T00:00:00Z';
          const cutoff = new Date().toISOString();

          async function apiGet(u) {
            const delays = [3000, 10000, 30000];
            for (let attempt = 0; ; attempt++) {
              try {
                const r = await fetch(u, {headers: {
                  Authorization: 'Bearer ' + token,
                  'Content-Type': 'application/json'
                }, signal: AbortSignal.timeout(20000), redirect: 'error'});
                if (!r.ok) {
                  const error = new Error('GoatCounter ' + u.pathname + ' HTTP ' + r.status);
                  error.retryable = [408, 429].includes(r.status) || r.status >= 500;
                  await r.body?.cancel();
                  throw error;
                }
                return await r.json();
              } catch (error) {
                if (error.retryable === false || attempt >= delays.length) throw error;
                console.log('Retrying statistics request (' + (attempt + 2) + '/4).');
                await new Promise(resolve => setTimeout(resolve, delays[attempt]));
              }
            }
          }

          // Resolve the existing aggregate path to its numeric ID first.
          // This also works when the server does not support path_by_name.
          async function findTotalPath() {
            let after = 0;
            for (let page = 0; page < 100; page++) {
              const u = new URL(base + '/paths');
              u.searchParams.set('limit', '200');
              u.searchParams.set('after', String(after));
              const d = await apiGet(u);
              if (!Array.isArray(d.paths)) throw new Error('Unexpected paths response');
              const found = d.paths.find(p => String(p.path).replace(/^\//, '') === 'site-total');
              if (found) {
                const id = Number(found.id);
                if (!Number.isInteger(id) || id <= 0) throw new Error('Invalid aggregate path ID');
                return id;
              }
              if (!d.more || !d.paths.length) break;
              const next = Number(d.paths[d.paths.length - 1].id);
              if (!(next > after)) throw new Error('Path pagination did not advance');
              after = next;
              await new Promise(resolve => setTimeout(resolve, 300));
            }
            throw new Error('The /site-total tracking path is not recorded in GoatCounter yet.');
          }
          const totalPathID = await findTotalPath();
          console.log('Aggregate tracking path found; requesting country statistics.');

          async function getAllLocations() {
            const all = [];
            let offset = 0;

            for (let page = 0; page < 20; page++) {
              const u = new URL(base + '/stats/locations');
              u.searchParams.set('start', start);
              u.searchParams.set('end', cutoff);
              u.searchParams.set('limit', '100');
              u.searchParams.set('offset', String(offset));
              u.searchParams.set('include_paths', String(totalPathID));

              const d = await apiGet(u);
              if (!Array.isArray(d.stats)) throw new Error('Unexpected GoatCounter response');
              const stats = d.stats;
              all.push(...stats);

              if (!d.more) return all;
              if (stats.length === 0) throw new Error('Country pagination did not advance');
              offset += stats.length;
            }
            throw new Error('Country pagination limit exceeded');
          }

          const countryNames = new Intl.DisplayNames(['en'], {type:'region'});
          const stats = await getAllLocations();

          let japan = 0;
          let international = 0;
          let unknown = 0;
          const countries = [];

          for (const item of stats) {
            const rawId = String(item.id ?? '').trim();
            const code = rawId.split('-')[0].toUpperCase();
            const count = Number(item.count);
            if (!Number.isSafeInteger(count) || count < 0) throw new Error('Invalid country count');

            if (!code || code === 'UNKNOWN' || code === 'ZZ') {
              unknown += count;
              continue;
            }

            if (code === 'JP') japan += count;
            else international += count;

            let name = String(item.name ?? '').trim();
            if (!name || name === code) {
              try { name = countryNames.of(code) || code; } catch { name = code; }
            }

            countries.push({code, name, count});
          }

          countries.sort((a,b) => b.count - a.count || a.name.localeCompare(b.name));

          const result = {
            status: 'ready',
            updatedAt: cutoff,
            since: start,
            japan,
            international,
            unknown,
            topCountries: countries.slice(0, 10)
          };

          fs.writeFileSync('visitor-country-stats.json', JSON.stringify(result, null, 2) + '\n');
          console.log(result);
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Commit public country summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the generated snapshot outside the checkout while advancing
          # to main. Replaying a JSON diff from an old run causes conflicts.
          summary_file="$(mktemp)"
          cp visitor-country-stats.json "$summary_file"
          trap 'rm -f "$summary_file"' EXIT

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --force -B main origin/main

            # Never replace a more recent snapshot published by another run.
            if node -e '
              const fs = require("fs");
              const saved = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const current = JSON.parse(fs.readFileSync("visitor-country-stats.json", "utf8"));
              process.exit(Date.parse(current.updatedAt) >= Date.parse(saved.updatedAt) ? 0 : 1);
            ' "$summary_file"; then
              echo "An equally recent or newer country summary is already published."
              exit 0
            fi

            cp "$summary_file" visitor-country-stats.json
            git add visitor-country-stats.json
            if git diff --cached --quiet; then
              echo "No country-stat changes."
              exit 0
            fi

            git commit -m "Update visitor country statistics"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed while publishing; retrying ($attempt/3)."
            sleep 2
          done

          echo "::error::Could not publish country statistics after 3 attempts."
          exit 1

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST "repos/${{ github.repository }}/pages/builds"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
